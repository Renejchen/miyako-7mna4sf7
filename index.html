<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="宮古島" />
<meta name="theme-color" content="#f7f3ea" />
<title>宮古島 5天4夜</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%231e5a7a'/%3E%3Cpath d='M20 118c14 0 14-10 28-10s14 10 28 10 14-10 28-10 14 10 28 10 14-10 28-10' stroke='%237fdbd4' stroke-width='9' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='90' cy='62' r='26' fill='%23f4d06f'/%3E%3C/svg%3E" />
<style>
:root{
  --bg:#f7f3ea; --soft:#fbf8f2; --card:#ffffff;
  --ink:#173b4d; --ink2:#2c5468; --muted:#8a9aa4; --line:#e4ded2;
  --blue:#1e5a7a; --blue-d:#14384a; --teal:#2aa8a8; --teal-l:#7fdbd4;
  --tip:#fdf3dd; --tip-b:#f0dfae; --tip-i:#c99a2e;
  --now:#d6f2e4; --now-b:#57bf92;
  --booked:#fbeccb; --booked-t:#a97b1e;
  --purple:#9b8ee0; --danger:#c4553d;
  --shadow:0 8px 24px rgba(23,59,77,.09);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:#e9e3d8;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Hiragino Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
/* #10：overflow-x:hidden 會讓 overflow-y 變成 auto、形成捲動容器，害 Day 分頁的 sticky 失效。
   clip 不會建立捲動容器，sticky 才會正常。 */
.app{width:min(100%,460px);margin:0 auto;background:var(--soft);min-height:100vh;position:relative;overflow-x:clip}
@supports not (overflow-x:clip){ .app{overflow-x:hidden} }
.hero{isolation:isolate}   /* #8：把 hero 子層的 z-index 關在自己的堆疊環境裡（未重現，保險用） */

/* ---------- hero map ---------- */
.hero{position:relative;height:260px;background:#cfe6ee;overflow:hidden}
#map{position:absolute;inset:0;background:#cfe6ee}
.hero-fade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(to bottom,rgba(20,56,74,0) 42%,rgba(20,56,74,.62) 78%,rgba(20,56,74,.8) 100%);z-index:500}
.hero-cap{position:absolute;left:16px;bottom:26px;z-index:501;pointer-events:none;color:#fff}
.hero-cap .eyebrow{font-size:10px;letter-spacing:.28em;opacity:.85;margin-bottom:4px}
.hero-cap h1{margin:0;font-size:27px;letter-spacing:.01em;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.hero-cap .dates{font-family:var(--mono);font-size:12px;opacity:.9;margin-top:3px}
.hero-hint{position:absolute;right:12px;top:12px;z-index:502;background:rgba(20,56,74,.72);color:#fff;
  font-size:11px;padding:5px 11px;border-radius:999px;backdrop-filter:blur(6px)}
.wave{position:absolute;left:0;right:0;bottom:-1px;z-index:503;display:block;width:100%;height:26px}
.maplink{position:absolute;left:0;right:0;bottom:0;z-index:504;height:26px}

/* ---------- day chips ---------- */
.days{position:sticky;top:0;z-index:60;background:rgba(251,248,242,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);padding:11px 0 10px}
.days-scroll{display:flex;gap:9px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.days-scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:8px 15px;text-align:center;line-height:1.25;cursor:pointer;transition:.15s}
.chip b{display:block;font-size:14px;font-weight:700}
.chip span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.chip.on{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
.chip.on span{color:#a9c9d6}
.chip.today::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--teal);margin:4px auto 0}

/* ---------- day header ---------- */
.dayhead{padding:20px 16px 4px;position:relative}
.dnum{font-size:52px;font-weight:800;color:var(--teal);line-height:.9;letter-spacing:-.02em}
.dnum small{font-size:20px;color:#b9c6cc;font-weight:700}
.ddate{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:7px;letter-spacing:.06em}
.dtitle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}
.dtitle{font-size:20px;font-weight:800;letter-spacing:.01em}
.deco{position:absolute;right:14px;top:22px;width:112px;opacity:.95}
.btn-edit{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:600;color:var(--blue);box-shadow:0 2px 6px rgba(23,59,77,.06);cursor:pointer}
.badge-state{display:inline-flex;align-items:center;gap:7px;margin-top:11px;background:var(--tip);
  border:1px solid var(--tip-b);color:#7a5a12;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px}
.badge-state i{width:7px;height:7px;border-radius:50%;background:var(--teal);display:inline-block}
.badge-state.done{background:#efe9dd;border-color:#ded5c4;color:#7b7264}
.badge-state.done i{background:#b3a894}
.badge-state.ro{background:#eef0fb;border-color:#d6dbf4;color:#4a4a86;margin-left:7px}
.badge-state.ro i{background:var(--purple)}
body.readonly .btn-edit{display:none}
.share-out{margin-top:12px}
.share-out textarea{width:100%;min-height:96px;font-family:var(--mono);font-size:11.5px;line-height:1.5;
  border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;word-break:break-all}
.share-meta{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.6}
.nav-btn{display:flex;align-items:center;justify-content:center;gap:9px;margin:12px 16px 6px;
  padding:15px 14px;border:0;border-radius:14px;width:calc(100% - 32px);cursor:pointer;
  background:linear-gradient(100deg,var(--blue) 0%,var(--teal) 100%);text-decoration:none;
  color:#fff;font-size:15.5px;font-weight:700;box-shadow:0 8px 20px rgba(30,90,122,.26)}
.nav-btn svg{flex:0 0 auto}
.nav-note{margin:8px 16px 0;font-size:12px;color:var(--muted);line-height:1.6}

/* ---------- timeline ---------- */
.tl{padding:12px 16px 120px;position:relative}
.row{display:grid;grid-template-columns:62px 1fr;gap:0;position:relative}
.rail{position:relative}
.rail::before{content:"";position:absolute;left:50px;top:0;bottom:-2px;width:2px;background:#d9e2e6}
.row:last-child .rail::before{bottom:auto;height:26px}
.rtime{font-family:var(--mono);font-size:12px;color:var(--muted);position:absolute;right:26px;top:19px;white-space:nowrap}
.dot{position:absolute;left:44px;top:22px;width:14px;height:14px;border-radius:50%;background:#fff;
  border:3px solid #b8c8cf;z-index:2}
.row.is-now .dot{border-color:var(--now-b);box-shadow:0 0 0 4px rgba(87,191,146,.18)}
.row.is-next .dot{border-color:var(--teal)}
.card{background:var(--card);border:1px solid transparent;border-radius:15px;padding:14px 15px;
  margin:8px 0 12px;box-shadow:var(--shadow)}
.row.is-now .card{border-color:var(--now-b);box-shadow:0 8px 22px rgba(87,191,146,.2)}
.row.is-next .card{border-color:var(--teal-l)}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.tag{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;background:var(--blue-d);color:#fff}
.tag.grey{background:#8fa3ac}
.tag.booked{background:var(--booked);color:var(--booked-t)}
.tag.now{background:var(--now);color:#1d7a55}
.tag.next{background:#dff3f1;color:#1c7d7d}
.cname{font-size:17.5px;font-weight:800;line-height:1.3;letter-spacing:.01em}
.csub{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
.meta{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.5}
.meta svg{flex:0 0 auto;margin-top:2px;opacity:.55}
.tip{display:flex;gap:8px;background:var(--tip);border:1px solid var(--tip-b);border-radius:11px;
  padding:11px 12px;margin-top:11px;font-size:13.5px;line-height:1.62;color:#6d5518}
.tip svg{flex:0 0 auto;margin-top:2px;color:var(--tip-i)}
.acts{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--blue);
  text-decoration:none;cursor:pointer}
.act.tel{color:var(--teal)}

/* ---------- toolbox ---------- */
/* #9：iPhone 動態視窗與安全區 */
.fab{position:fixed;right:calc(50% - min(50%,230px) + 18px);
  bottom:calc(20px + env(safe-area-inset-bottom));z-index:90;width:58px;height:58px;
  border-radius:50%;border:0;background:var(--purple);color:#fff;cursor:pointer;
  box-shadow:0 10px 26px rgba(155,142,224,.5);display:grid;place-items:center}
.sheet{position:fixed;inset:0;z-index:200;display:none}
.sheet.on{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(20,40,52,.42)}
.sheet-body{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,460px);
  max-height:92vh;overflow-y:auto;background:var(--soft);border-radius:22px 22px 0 0;
  -webkit-overflow-scrolling:touch;
  padding:0 16px calc(30px + env(safe-area-inset-bottom))}
@supports (height:100dvh){ .sheet-body{max-height:88dvh} }
.grab{width:44px;height:5px;border-radius:99px;background:#d9d2c5;margin:10px auto 12px}
/* 分頁列黏在 sheet 頂端：往下滑也選得到天氣／租車 */
.sheet-stick{position:sticky;top:0;z-index:6;background:var(--soft);margin:0 -16px;padding:0 16px;
  box-shadow:0 6px 12px -8px rgba(23,59,77,.28)}
.tb-tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.tb-tabs::-webkit-scrollbar{display:none}
.tb-tab{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;
  font-size:13px;font-weight:600;cursor:pointer}
.tb-tab.on{background:var(--blue-d);border-color:var(--blue-d);color:#fff}
.panel{display:none}.panel.on{display:block}
.pcard{background:#fff;border-radius:15px;padding:15px;margin-bottom:13px;box-shadow:var(--shadow)}
.pcard h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:9px}
.pcard h3 .ic{width:30px;height:30px;border-radius:50%;background:#eaf4f6;display:grid;place-items:center;flex:0 0 auto}
.kv{display:grid;grid-template-columns:74px 1fr;gap:9px 12px;font-size:14px;align-items:baseline}
.kv dt{color:var(--muted);font-size:13px}
.kv dd{margin:0;font-weight:600;line-height:1.5;word-break:break-word}
.kv dd.mono{font-family:var(--mono)}
.fl{display:flex;align-items:center;justify-content:space-between;background:#f6f2ea;border-radius:12px;padding:13px 14px;margin-bottom:11px}
.fl .side{text-align:center}
.fl .t{font-family:var(--mono);font-size:23px;font-weight:700;letter-spacing:-.02em}
.fl .p{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.fl .mid{flex:1;padding:0 12px;text-align:center;color:var(--teal)}
.fl .mid .line{border-top:1.5px dashed #b7cfd6;margin:0 0 4px}
.fl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fl-head .lbl{background:#e3eff3;color:var(--blue);font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px}
.fl-head .no{font-family:var(--mono);font-weight:700;color:var(--blue-d)}
/* 天氣改直式清單：五天一定全部看得到，不用橫向滑 */
.wx{display:flex;flex-direction:column;gap:7px}
.wxd{display:grid;grid-template-columns:auto 30px 1fr auto;align-items:center;gap:10px;
  background:#f6f2ea;border-radius:12px;padding:11px 13px}
.wxd .d{font-family:var(--mono);font-size:13px;color:var(--ink2);white-space:nowrap}
.wxd .d b{font-weight:700}
.wxd .e{font-size:21px;line-height:1;text-align:center}
.wxd .tt{font-family:var(--mono);font-size:14px;white-space:nowrap}
.wxd .tt b{font-weight:700;font-size:15.5px}
.wxd .tt span{color:var(--muted)}
.wxd .pp{font-size:12.5px;color:var(--teal);white-space:nowrap;font-family:var(--mono)}
.wxd.today{background:#e3f4ee;box-shadow:inset 0 0 0 1.5px #9bd8bd}
.prog{height:7px;border-radius:99px;background:#e7e0d4;overflow:hidden;margin:6px 0 16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-l));border-radius:99px;transition:.3s}
.buy-item{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed #ece5d8;cursor:pointer}
.buy-item:last-child{border-bottom:0}
.box{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:2px solid #c6cfd4;margin-top:1px;display:grid;place-items:center}
.buy-item.done .box{background:var(--blue);border-color:var(--blue)}
.buy-item.done .bt{text-decoration:line-through;color:#b6bec3}
.buy-item.done .bs{text-decoration:line-through;color:#c8ced2}
.bt{font-weight:700;font-size:14.5px}
.bs{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.note{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}

/* ---------- edit mode ---------- */
.ed-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px}
.ed-head h2{margin:0;font-size:19px}
.btn-back{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:13.5px;font-weight:600;color:var(--blue);cursor:pointer}
.ed-note{font-size:12.5px;color:var(--muted);line-height:1.65;padding:6px 16px 12px}
.ed-list{padding:0 16px 24px}
.ed-item{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:12px 13px;margin-bottom:9px;box-shadow:0 2px 8px rgba(23,59,77,.05);touch-action:pan-y}
.ed-item.dragging{opacity:.92;box-shadow:0 14px 30px rgba(23,59,77,.2);transform:scale(1.02);position:relative;z-index:5}
.ed-item.ghost{opacity:.28}
.handle{flex:0 0 auto;width:26px;color:#a9b6bc;cursor:grab;touch-action:none;display:grid;place-items:center}
.ed-info{flex:1;min-width:0}
.ed-info b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-info span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ed-act{background:none;border:0;color:var(--blue);font-size:13.5px;font-weight:600;padding:6px 4px;cursor:pointer}
.ed-act.del{color:var(--danger)}
.ed-btns{display:flex;gap:9px;margin-top:14px}
.ed-btns button{flex:1;min-width:0;padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:13.5px;font-weight:700;color:var(--blue);cursor:pointer;white-space:nowrap}
.ed-btns button.warn{color:var(--danger)}
body.editing .fab{display:none}
.saved{margin-top:12px;padding:13px;border-radius:12px;background:#eaf6f0;color:#1d7a55;
  text-align:center;font-weight:700;font-size:14px}

/* ---------- form ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:12px 13px;font-size:15px;font-weight:600;outline:none}
.field textarea{font-weight:400;line-height:1.6;min-height:78px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal)}
.field .ok{font-size:12px;color:#1d8a5a;margin-top:5px;font-weight:600}
.field .bad{font-size:12px;color:var(--danger);margin-top:5px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.sheet-actions button{flex:1;padding:15px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.sheet-actions button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.hide{display:none !important}
.leaflet-container{background:#cfe6ee !important;font:inherit !important}
.pin{display:grid;place-items:center;width:28px;height:28px;border-radius:50% 50% 50% 6px;
  transform:rotate(-45deg);background:var(--blue);color:#fff;font-weight:800;font-size:13px;
  border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.pin span{transform:rotate(45deg)}
.pin.now{background:var(--now-b)}
.pop b{display:block;font-size:15px;margin-bottom:2px}
.pop .m{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:9px}
.pop .btns{display:flex;gap:7px}
.pop a{flex:1;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:9px;
  padding:7px 10px;font-size:13px;font-weight:600;color:var(--blue)}
.fallmap{position:absolute;inset:0;display:none}
.fallmap.on{display:block}
</style>
</head>
<body>
<div class="app">

  <!-- ============ HERO ============ -->
  <div class="hero">
    <div id="map"></div>
    <svg class="fallmap" id="fallmap" viewBox="0 0 460 260" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="hero-fade"></div>
    <div class="hero-hint" id="mapHint">點圖釘看店家 · 可縮放</div>
    <div class="hero-cap">
      <div class="eyebrow">MIYAKOJIMA · OKINAWA</div>
      <h1>宮古島 5天4夜</h1>
      <div class="dates">8/5 – 8/9</div>
    </div>
    <svg class="wave" viewBox="0 0 460 26" preserveAspectRatio="none">
      <path d="M0 14c38 0 38-9 76-9s38 9 76 9 38-9 77-9 38 9 77 9 38-9 77-9 38 9 77 9v12H0z" fill="#7fdbd4"/>
      <path d="M0 20c38 0 38-8 76-8s38 8 76 8 38-8 77-8 38 8 77 8 38-8 77-8 38 8 77 8v6H0z" fill="#fbf8f2"/>
    </svg>
  </div>

  <!-- ============ DAY CHIPS ============ -->
  <div class="days"><div class="days-scroll" id="chips"></div></div>

  <!-- ============ VIEW: ITINERARY ============ -->
  <div id="viewTrip">
    <div class="dayhead">
      <svg class="deco" viewBox="0 0 120 70" fill="none">
        <circle cx="103" cy="13" r="9" fill="#f4d06f"/>
        <path d="M14 44V22" stroke="#2aa8a8" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M2 23c0-7 5.4-12.5 12-12.5S26 16 26 23z" fill="#2aa8a8"/>
        <circle cx="59" cy="21" r="6.4" fill="#1e5a7a"/><circle cx="76" cy="21" r="6.4" fill="#1e5a7a"/>
        <path d="M50 44c0-7 4-12 9-12s9 5 9 12zM67 44c0-7 4-12 9-12s9 5 9 12z" fill="#1e5a7a"/>
        <path d="M40 15.5c1.6-1.8 4.4-1.8 6 0 1.6 1.8 1.6 4.6 0 6.4L43 25l-3-3.1c-1.6-1.8-1.6-4.6 0-6.4z" fill="#e88fa0"/>
        <path d="M0 56c15 0 15-6 30-6s15 6 30 6 15-6 30-6 15 6 30 6" stroke="#7fdbd4" stroke-width="3" stroke-linecap="round"/>
        <path d="M0 66c15 0 15-6 30-6s15 6 30 6 15-6 30-6 15 6 30 6" stroke="#cfeae7" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <div class="dnum" id="dNum">1<small> / 5</small></div>
      <div class="ddate" id="dDate"></div>
      <div class="dtitle-row">
        <div class="dtitle" id="dTitle"></div>
        <button class="btn-edit" id="btnEdit">✎ 編輯行程</button>
      </div>
      <div id="dBadge"></div>
    </div>
    <div id="navBtns"></div>
    <div class="tl" id="tl"></div>
  </div>

const b64u = {
  enc: bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""),
  dec: s => Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0))
};
/* 只編碼「跟原始行程不一樣」的那幾天，連結才不會又臭又長 */
function tripDiff(trip){
  const d = {};
  trip.days.forEach((day,i)=>{
    if(JSON.stringify(day) !== JSON.stringify(DEFAULT_TRIP.days[i])) d[i] = day;
  });
  return d;
}
function applyDiff(diff){
  const t = JSON.parse(JSON.stringify(DEFAULT_TRIP));
  Object.entries(diff||{}).forEach(([i,day])=>{ if(t.days[+i]) t.days[+i] = day; });
  return t;
}
async function encodeTrip(trip){
  const json = JSON.stringify({v:1, d:tripDiff(trip), at:new Date().toISOString()});
  const raw = new TextEncoder().encode(json);
  if(typeof CompressionStream === "undefined") return "r" + b64u.enc(raw);
  const blob = await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"))).blob();
  return "z" + b64u.enc(new Uint8Array(await blob.arrayBuffer()));
}
async function decodeTrip(s){

    /* #3：舊機器（iOS 16.4 以前）沒有 DecompressionStream。以前這裡失敗會靜靜退回原始行程，
       家人就看到「舊行程」還以為是最新的。現在一律丟錯，由呼叫端顯示明確警告。 */
    if(typeof DecompressionStream === "undefined")
      throw new Error("這支手機的瀏覽器太舊，無法解開壓縮過的行程連結");
    const blob = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).blob();
    json = new TextDecoder().decode(new Uint8Array(await blob.arrayBuffer()));
  }else{
    json = new TextDecoder().decode(bytes);
  }
  const p = JSON.parse(json);
  return {t: applyDiff(p.d), at: p.at};
}

/* =====================================================================
   時間工具（一律用日本時間判斷）
   ===================================================================== */
function nowJP(){
  const d = new Date();
  return new Date(d.getTime() + (d.getTimezoneOffset() + TZ_OFFSET_JP*60) * 60000);
}
function jpDateStr(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function todayIndex(){
  const t = jpDateStr(nowJP());
  return TRIP.days.findIndex(d => d.date === t);
}
function tripPhase(){
  const t = jpDateStr(nowJP());
  if(t < TRIP.days[0].date) return "before";
  if(t > TRIP.days[TRIP.days.length-1].date) return "after";
  return "during";
}
function minutes(hhmm){ const [h,m] = (hhmm||"00:00").split(":").map(Number); return h*60 + (m||0); }
function fmtDate(iso){ const [,m,d] = iso.split("-"); return `${+m}/${+d}`; }

/* 找出「目前這一站」與「下一站」：只在今天有效 */
function liveIndex(dayIdx){
  if(dayIdx !== todayIndex()) return {now:-1, next:-1};
  const n = nowJP(); const cur = n.getHours()*60 + n.getMinutes();
  const stops = TRIP.days[dayIdx].stops;
  let now = -1;
  for(let i=0;i<stops.length;i++){ if(minutes(stops[i].time) <= cur) now = i; }
  const next = (now + 1 < stops.length) ? now + 1 : -1;
  return {now, next};
}

/* =====================================================================
   Google Maps 連結
   ===================================================================== */
function stopQuery(s){
  if(s.mapq) return s.mapq;
  if(s.lat != null && s.lon != null) return `${s.lat},${s.lon}`;
  return s.name;
}
/* #12：mapq 如果本身就是一個網址（例如貼進來的 maps.app.goo.gl 短連結），
   要直接開它，不能再包成搜尋關鍵字，否則會開到錯的地方。 */
const isUrl = v => typeof v === "string" && /^https?:\/\//i.test(v.trim());
function mapUrl(s){
  if(isUrl(s.mapq)) return s.mapq.trim();
  if(s.lat != null && s.lon != null && !s.mapq)
    return `https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(stopQuery(s))}`;
}
/* #7 Google Maps URLs 官方限制：手機瀏覽器最多 3 個中途點，其他平台最多 9 個。
   （https://developers.google.com/maps/documentation/urls/get-started）
   超過就會被靜默忽略 → 會帶錯路線。所以自動分段，段與段之間共用一站接續。 */
const isMobileUA = () => /iphone|ipad|ipod|android/i.test(navigator.userAgent || "");
function navQuery(s){
  if(s.lat != null && s.lon != null) return `${s.lat},${s.lon}`;
  if(s.mapq && !isUrl(s.mapq)) return s.mapq;   // 短網址不能當中途點
  return s.name;
}
function daySegments(dayIdx){
  const stops = (TRIP.days[dayIdx] || {}).stops || [];
  if(stops.length < 2) return [];
  const perSeg = (isMobileUA() ? 3 : 9) + 2;    // 起點 + 中途點 + 終點
  const segs = [];
  for(let i = 0; i < stops.length - 1; i += perSeg - 1){
    segs.push({ from:i, stops: stops.slice(i, i + perSeg) });
  }
  return segs;
}
function segUrl(chunk){
  const pts = chunk.map(navQuery);
  const mid = pts.slice(1,-1).map(encodeURIComponent).join("%7C");
  let u = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(pts[0])}`
        + `&destination=${encodeURIComponent(pts[pts.length-1])}&travelmode=driving`;
  if(mid) u += `&waypoints=${mid}`;
  return u;
}
function renderNavButtons(dayIdx){

    return `<a class="nav-btn" href="${segUrl(sg.stops)}" target="_blank" rel="noopener">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 20l-5.4 1.8L5.4 4 9 2.2 15 5l5.4-1.8L18.6 20 15 21.8z"/><path d="M9 2.2v18M15 5v16.8"/>
      </svg><span>${esc(label)}</span></a>`;
  }).join("")
  + (one ? "" : `<p class="nav-note">Google 地圖在手機上一條路線最多只吃 3 個中途點，所以這天拆成 ${segs.length} 段（段與段共用一站接續），不會漏站。</p>`);
}
/* 從貼上的 Google Maps 網址抽座標 */
function parseCoords(url){
  if(!url) return null;
  let m = url.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);        if(m) return [+m[1], +m[2]];
  m = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);                 if(m) return [+m[1], +m[2]];
  m = url.match(/[?&](?:q|query|daddr|ll)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/); if(m) return [+m[1], +m[2]];
  return null;
}

let map = null, layer = null, leafletOK = false;
function initMap(){
  if(typeof L === "undefined"){ leafletOK = false; return; }
  try{
    map = L.map("map",{zoomControl:true, attributionControl:false, scrollWheelZoom:false});
    const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18});
    /* #13：離線時 Leaflet 程式還在、但圖磚全掛 → 只剩藍底。連續失敗就切成 SVG 備援地圖。 */
    let tileFail = 0, tileOK = false;
    tiles.on("tileload", ()=>{ tileOK = true; });
    tiles.on("tileerror", ()=>{
      if(tileOK || ++tileFail < 4) return;
      console.warn("圖磚載入失敗，改用離線備用地圖");
      leafletOK = false; drawMap();
    });
    tiles.addTo(map);
    layer = L.layerGroup().addTo(map);
    map.setView([24.80,125.28], 11);
    leafletOK = true;
  }catch(e){ console.warn("地圖初始化失敗，改用離線版", e); leafletOK = false; }
}
function drawMap(){
  const stops = TRIP.days[curDay].stops;
  const pinned = stops.map((s,i)=>({s,i})).filter(o => o.s.lat != null && o.s.lon != null);
  const missing = stops.length - pinned.length;
  document.getElementById("mapHint").textContent =
    missing > 0 ? `點圖釘看店家 · ${missing} 站未定位` : "點圖釘看店家 · 可縮放";

  if(!leafletOK){ drawFallback(pinned); return; }
  document.getElementById("fallmap").classList.remove("on");
  layer.clearLayers();
  if(pinned.length === 0){ map.setView([24.80,125.28],11); return; }

  const live = liveIndex(curDay);
  const latlngs = pinned.map(o => [o.s.lat, o.s.lon]);
  L.polyline(latlngs,{color:"#1e5a7a",weight:2.5,opacity:.75,dashArray:"3 7"}).addTo(layer);

  pinned.forEach(o => {
    const isNow = o.i === live.now;
    const icon = L.divIcon({className:"", iconSize:[28,28], iconAnchor:[14,26],
      html:`<div class="pin${isNow?" now":""}"><span>${o.i+1}</span></div>`});
    const m = L.marker([o.s.lat,o.s.lon],{icon}).addTo(layer);
    m.bindPopup(`<div class="pop"><b>${esc(o.s.name)}</b>
      <div class="m">${o.s.time} · ${o.s.cat}</div>
      <div class="btns"><a href="${mapUrl(o.s)}" target="_blank" rel="noopener">Google 地圖</a>
      ${o.s.tel?`<a href="tel:${o.s.tel}">撥號</a>`:""}</div></div>`);
  });
  map.fitBounds(L.latLngBounds(latlngs).pad(.28), {animate:false});
}
/* 離線／載不到圖磚時的備用地圖：純 SVG，靠經緯度投影 */
function drawFallback(pinned){
  const svg = document.getElementById("fallmap");
  svg.classList.add("on");
  if(pinned.length === 0){ svg.innerHTML = ""; return; }
  const lats = pinned.map(o=>o.s.lat), lons = pinned.map(o=>o.s.lon);
  const pad = 46, W = 460, H = 260;
  const la0 = Math.min(...lats), la1 = Math.max(...lats);
  const lo0 = Math.min(...lons), lo1 = Math.max(...lons);
  const sx = v => (la1===la0 && lo1===lo0) ? W/2 : pad + (v - lo0)/((lo1-lo0)||1)*(W-2*pad);
  const sy = v => (la1===la0) ? H/2 : pad + (la1 - v)/((la1-la0)||1)*(H-2*pad-30);
  const pts = pinned.map(o=>[sx(o.s.lon), sy(o.s.lat)]);
  const live = liveIndex(curDay);
  let html = `<rect width="460" height="260" fill="#cfe6ee"/>`;
  html += `<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#1e5a7a" stroke-width="2" stroke-dasharray="3 7" opacity=".7"/>`;
  pinned.forEach((o,k)=>{
    const [x,y] = pts[k], isNow = o.i === live.now;
    html += `<g transform="translate(${x},${y})">
      <circle r="12" fill="${isNow?"#57bf92":"#1e5a7a"}" stroke="#fff" stroke-width="2"/>
      <text y="4.5" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">${o.i+1}</text></g>`;
  });
  svg.innerHTML = html;
}

/* 觸控 + 滑鼠都能用的拖曳排序 */
function bindDrag(){
  const list = document.getElementById("edList");
  let dragEl=null, startY=0, items=[], fromIdx=-1;

  list.querySelectorAll("[data-drag]").forEach(h=>{
    h.addEventListener("pointerdown", e=>{
      e.preventDefault();
      dragEl = h.closest(".ed-item");
      fromIdx = +dragEl.dataset.i;
      startY = e.clientY;
      items = [...list.querySelectorAll(".ed-item")];
      dragEl.classList.add("dragging");
      h.setPointerCapture(e.pointerId);
    });
    h.addEventListener("pointermove", e=>{
      if(!dragEl) return;
      const dy = e.clientY - startY;
      dragEl.style.transform = `translateY(${dy}px)`;
      const mid = dragEl.getBoundingClientRect().top + dragEl.offsetHeight/2;
      items.forEach(it=>{
        if(it===dragEl) return;
        const r = it.getBoundingClientRect();
        it.classList.toggle("ghost", mid > r.top && mid < r.bottom);
      });
    });
    /* #11b：pointercancel（iOS 把手勢收走時會發）不可以當成「放開」提交排序，
       否則會在使用者沒有真的拖曳的情況下把順序改掉。只還原畫面。 */
    const cancel = ()=>{
      if(!dragEl) return;
      dragEl.style.transform=""; dragEl.classList.remove("dragging");
      items.forEach(it=>it.classList.remove("ghost"));
      dragEl = null;
    };
    const end = e=>{
      if(!dragEl) return;
      const mid = dragEl.getBoundingClientRect().top + dragEl.offsetHeight/2;
      let toIdx = fromIdx;
      items.forEach(it=>{
        if(it===dragEl) return;
        const r = it.getBoundingClientRect();
        if(mid > r.top && mid < r.bottom) toIdx = +it.dataset.i;
      });
      dragEl.style.transform=""; dragEl.classList.remove("dragging");
      items.forEach(it=>it.classList.remove("ghost"));
      dragEl = null;
      if(toIdx !== fromIdx){
        const arr = TRIP.days[curDay].stops;
        arr.splice(toIdx, 0, arr.splice(fromIdx,1)[0]);
        MANUAL_ORDER.add(curDay);              // #11a：這天已被手動排過，之後別自動照時間重排
        const ok = saveState(); renderEditList();
        edMsg(ok === false ? "順序已改，但這台裝置存不了，關掉就會還原" : "順序已更新（只存在這支手機）");
      }
    };
    h.addEventListener("pointerup", end);
    h.addEventListener("pointercancel", cancel);
  });
}

function openForm(idx){
  editing = {day:curDay, idx};
  const s = idx >= 0 ? TRIP.days[curDay].stops[idx] : {time:"12:00",cat:"景點",name:"",sub:""};
  document.getElementById("fmTitle").textContent = idx >= 0 ? "編輯行程" : "新增行程";
  document.getElementById("fCat").innerHTML = CATS.map(c=>`<option${c===s.cat?" selected":""}>${c}</option>`).join("");
  document.getElementById("fDay").innerHTML = TRIP.days.map((d,i)=>
    `<option value="${i}"${i===curDay?" selected":""}>Day ${i+1}（${fmtDate(d.date)} ${d.dow}）</option>`).join("");
  fmt("fTime", s.time); fmt("fName", s.name); fmt("fSub", s.sub||"");
  fmt("fDrive", s.drive||""); fmt("fHours", s.hours||""); fmt("fTel", s.tel||"");
  fmt("fBooked", s.booked||""); fmt("fTip", s.tip||"");
  fmt("fUrl", s.gurl||"");
  showUrlMsg(s.lat!=null ? [s.lat,s.lon] : null, !!s.gurl);
  document.getElementById("fmSheet").classList.add("on");
}
const fmt = (id,v) => document.getElementById(id).value = v;
function showUrlMsg(coords, hasUrl){
  const el = document.getElementById("fUrlMsg");
  if(coords) el.innerHTML = `<div class="ok">✓ 已定位 ${coords[0].toFixed(5)}, ${coords[1].toFixed(5)} —— 地圖上會出現圖釘</div>`;
  else if(hasUrl) el.innerHTML = `<div class="bad">短連結沒有座標，地圖上不會有圖釘（「地圖」按鈕仍可用）</div>`;
  else el.innerHTML = "";
}
document.getElementById("fUrl").addEventListener("input", e=>{
  showUrlMsg(parseCoords(e.target.value), !!e.target.value.trim());
});
document.getElementById("fmSave").onclick = ()=>{
  const v = id => document.getElementById(id).value.trim();
  const name = v("fName");
  if(!name){ alert("請填名稱"); return; }
  const url = v("fUrl"), c = parseCoords(url);
  const prev = editing.idx >= 0 ? TRIP.days[editing.day].stops[editing.idx] : null;

  /* 以原本那一站為底再覆蓋表單欄位 —— 不可以整個重建，
     否則只改個副標題就會把既有的座標／精選地圖查詢弄丟（圖釘會消失）。 */
  const s = Object.assign({}, prev, {
    time:v("fTime")||"12:00", cat:v("fCat"), name, sub:v("fSub"),
    drive:v("fDrive"), hours:v("fHours"), tel:v("fTel"),
    booked:v("fBooked"), tip:v("fTip")
  });

  if(url){
    s.gurl = url;
    if(c){                                   // 完整連結：座標優先，蓋掉舊定位
      s.lat = c[0]; s.lon = c[1]; delete s.mapq;
    }else{                                   // 短連結：拿來當地圖連結，舊座標不再適用
      s.mapq = url; delete s.lat; delete s.lon;
    }
  }else if(!prev){
    s.mapq = name;                           // 全新的一站又沒給連結 → 用名稱搜尋
  }
  /* 舊的 mapq 只是從舊名稱來的，改名後要跟著改；精選的查詢字串則保留 */
  if(prev && prev.mapq && prev.mapq === prev.name && name !== prev.name) s.mapq = name;

  const from = editing.day;
  const to   = +document.getElementById("fDay").value;
  const byTime = (a,b)=>minutes(a.time)-minutes(b.time);
  let moved = false;
  if(editing.idx >= 0 && to !== from){
    TRIP.days[from].stops.splice(editing.idx, 1);   // 從原本那天拿掉
    TRIP.days[to].stops.push(s);
    moved = true;
  }else if(editing.idx >= 0){
    TRIP.days[from].stops[editing.idx] = s;
  }else{
    TRIP.days[to].stops.push(s);
    moved = to !== from;
  }
  /* #11a：只有「新增」或「時間真的改了」才重排；否則使用者手動拖好的順序會被洗掉。
     手動排過的那天，除非是新增進來的，一律不動順序。 */
  const timeChanged = prev ? prev.time !== s.time : true;
  const shouldSort = d => !MANUAL_ORDER.has(d) || timeChanged || editing.idx < 0 || moved;
  if(shouldSort(from)) TRIP.days[from].stops.sort(byTime);
  if(to !== from && shouldSort(to)) TRIP.days[to].stops.sort(byTime);

  const ok = saveState();
  document.getElementById("fmSheet").classList.remove("on");
  renderEditList();
  if(ok === false) edMsg("改好了，但這台裝置存不了，關掉就會還原");
  else edMsg(moved ? `已移到 Day ${to+1}（${fmtDate(TRIP.days[to].date)}）` : "已儲存");
};

/* ---- 產生家人版（唯讀）連結 ---- */
async function makeShareLink(){
  const out = document.getElementById("shareOut");
  out.innerHTML = `<p class="share-meta">產生中…</p>`;
  try{
    const payload = await encodeTrip(TRIP);
    const base = location.origin === "null"
      ? location.href.split("#")[0]                     // 本機檔案
      : location.origin + location.pathname;
    const url = base + "#trip=" + payload;
    const kb = (url.length/1024).toFixed(1);
    const local = base.startsWith("file:");
    out.innerHTML = `<div class="share-out">
      <textarea readonly id="shareUrl">${esc(url)}</textarea>
      <div class="ed-btns">
        <button id="btnCopy">複製連結</button>
        ${navigator.share?`<button id="btnSend" style="color:#4a4a86">分享到 LINE…</button>`:""}
      </div>
      <p class="share-meta">長度 ${kb} KB。家人打開這個連結會看到<b>你現在這一版</b>的行程，而且沒有編輯按鈕、改不到你的資料。
      ${local?`<br><b style="color:#c4553d">⚠️ 現在是本機檔案，這個連結只有你自己的電腦打得開。</b>要讓家人能開，必須先把 App 放到一個網址上（做法 B）。`:""}
      <br>之後你每改一次行程，要重新按一次這顆按鈕、把新連結再貼給家人。</p>
    </div>`;
    const copy = document.getElementById("btnCopy");
    if(copy) copy.onclick = async ()=>{
      try{ await navigator.clipboard.writeText(url); edMsg("連結已複製"); }
      catch(e){ document.getElementById("shareUrl").select(); edMsg("請長按上面的欄位複製"); }
    };
    const send = document.getElementById("btnSend");
    if(send) send.onclick = ()=>navigator.share({title:"宮古島行程 8/5–8/9", url}).catch(()=>{});
  }catch(e){
    console.warn("產生連結失敗", e);
    out.innerHTML = `<p class="share-meta" style="color:#c4553d">產生失敗：${esc(e.message)}</p>`;
  }
}

/* ---- 天氣：Open-Meteo，免金鑰 ---- */
const WX_ICON = {0:"☀️",1:"🌤",2:"⛅",3:"☁️",45:"🌫",48:"🌫",51:"🌦",53:"🌦",55:"🌦",
  61:"🌧",63:"🌧",65:"🌧",71:"🌨",80:"🌦",81:"🌧",82:"⛈",95:"⛈",96:"⛈",99:"⛈"};
let wxLoaded = false;
async function loadWeather(){
  const box = document.getElementById("wxBox"); if(!box) return;
  const cached = EXTRA.wx;
  /* #4：工具箱每次開啟都會重建面板，所以就算抓過了也必須把快取重畫到「這個新的」wxBox，
     不能直接 return，否則第二次打開會永遠停在「讀取中…」。 */
  if(cached) paintWeather(cached.data, cached.at);
  if(wxLoaded){
    if(!cached) box.innerHTML = `<p class="note">抓不到天氣，等有網路時再打開一次。</p>`;
    return;
  }
  try{
    const u = "https://api.open-meteo.com/v1/forecast?latitude=24.80&longitude=125.28"
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"
      + "&timezone=Asia%2FTokyo&start_date=2026-08-05&end_date=2026-08-09";
    const r = await fetch(u); if(!r.ok) throw new Error("HTTP "+r.status);
    const j = await r.json();
    EXTRA.wx = {data:j.daily, at:new Date().toISOString()}; saveExtra();
    paintWeather(j.daily, EXTRA.wx.at); wxLoaded = true;
  }catch(e){
    if(!cached) box.innerHTML = `<p class="note">抓不到天氣（可能沒有網路）。有網路時再打開一次就會存起來。</p>`;
    console.warn("天氣讀取失敗", e);
  }
}
const WK = ["日","一","二","三","四","五","六"];
function paintWeather(d, at){
  const box = document.getElementById("wxBox"); if(!box || !d) return;
  const today = jpDateStr(nowJP());
  box.innerHTML = d.time.map((t,i)=>{
    const [y,m,dd] = t.split("-");
    const wk = WK[new Date(+y, +m-1, +dd).getDay()];
    const dayNo = TRIP.days.findIndex(x=>x.date === t);
    return `<div class="wxd${t===today?" today":""}">
      <div class="d"><b>${+m}/${+dd}</b>（${wk}）${dayNo>=0?` D${dayNo+1}`:""}</div>
      <div class="e">${WX_ICON[d.weather_code[i]] || "⛅"}</div>
      <div class="tt"><b>${Math.round(d.temperature_2m_max[i])}°</b> <span>/ ${Math.round(d.temperature_2m_min[i])}°</span></div>
      <div class="pp">☂ ${d.precipitation_probability_max[i]}%</div></div>`;
  }).join("");
  const n = document.getElementById("wxNote");
  if(n && at) n.innerHTML = `最後更新：${new Date(at).toLocaleString("zh-TW")}<br>` + n.innerHTML.split("<br>").slice(-1)[0];
}

  w.style.cssText = "background:#fbe9e4;border-bottom:1px solid #f0cabf;color:#9c3d26;"
    + "font-size:12.5px;line-height:1.6;padding:10px 16px;text-align:center";
  w.innerHTML = "⚠️ 這台裝置不能儲存修改（用本機檔案打開時的限制）。<br>行程照樣看得到，但你改的東西關掉就會不見。";
  document.querySelector(".app").prepend(w);
}

initMap();
document.body.classList.toggle("readonly", READONLY);

function boot(){
  const t0 = todayIndex();
  curDay = t0 >= 0 ? t0 : (tripPhase() === "after" ? TRIP.days.length-1 : 0);
  rerender(t0 >= 0);
}
/* 進入家人版（唯讀）；boot 與貼上連結時都走這裡 */
function enterShared(payload){
  return decodeTrip(payload).then(p=>{
    if(p && p.t && p.t.days && p.t.days.length){ TRIP = p.t; SHARED_AT = p.at; }
    READONLY = true;
    document.body.classList.add("readonly");
    showEdit(false);
    boot();
  }).catch(e=>{
    /* #3：絕對不可以默默顯示原始行程假裝成功 —— 家人會照著過期的行程走。 */
    console.warn("家人版連結解析失敗", e);
    READONLY = true; document.body.classList.add("readonly");
    const w = document.createElement("div");
    w.style.cssText = "background:#fbe4de;border-bottom:2px solid #e0a494;color:#8c2f16;"
      + "font-size:13.5px;line-height:1.7;padding:14px 16px;text-align:center;font-weight:600";
    w.innerHTML = "⚠️ <b>這個連結打不開，下面顯示的不是最新行程</b><br>"
      + "<span style='font-weight:400'>" + esc(e.message || "連結可能被截斷或損壞")
      + "。請 Rene 重新產生一次連結傳給你，先不要照下面的行程走。</span>";
    document.querySelector(".app").prepend(w);
    boot();
  });
}
if(SHARED) enterShared(SHARED); else boot();

window.addEventListener("hashchange", ()=>{
  if(location.hash.startsWith("#trip=")) enterShared(location.hash.slice(6));
});
// 每分鐘更新「目前行程」高亮
setInterval(()=>{ if(document.getElementById("viewEdit").classList.contains("hide")) renderDay(); }, 60000);
window.addEventListener("load", ()=>{ if(leafletOK && map) setTimeout(()=>{ map.invalidateSize(); drawMap(); }, 300); });
</script>
</body>
</html>
